name: site_expense_tracker
description: "Site Expense Tracker - track construction site expenses, daily reports, and bills."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.6.0

  # Local storage
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.1.0
  flutter_secure_storage: ^9.2.2

  # Models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  cached_network_image: ^3.4.1

  # Connectivity
  connectivity_plus: ^6.0.5

  # Utils
  equatable: ^2.0.5
  uuid: ^4.5.1
  path_provider: ^2.1.4

  # PDF generation & sharing
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
